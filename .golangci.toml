version = '2'

[linters]
enable = [
  'bodyclose',
  'goconst',
  'gocyclo',
  'gosec',
  'misspell',
  'revive',
  'tparallel',
  'unconvert',
  'unparam'
]

[linters.exclusions]
generated = 'lax'
paths = [
  'third_party$',
  'builtin$',
  'examples$'
]

[formatters]
enable = [
  'goimports'
]

[formatters.exclusions]
generated = 'lax'
paths = [
  'third_party$',
  'builtin$',
  'examples$',
]
